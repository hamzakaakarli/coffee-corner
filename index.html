<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Corner</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <h1 class="brand">Coffee Corner</h1>
    <nav class="nav">
      <a href="#about">About</a>
      <a href="#criteria">Criteria</a>
      <a href="#reviews">Reviews</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <p class="hero-eyebrow">A Coffee Journal</p>
    <h1>Good coffee,<br><em>honest reviews.</em></h1>
    <p class="hero-sub">Independent reviews of coffee shops across Michigan and beyond.</p>
  </div>
</section>

<main class="container">

<section id="reviews">
  <h2>My Reviews</h2>

  <div class="grid">

    <!-- SHINOLA (CLICKABLE) -->
    <div class="card">
      <img src="images/shinolacoffeeannarbor.jpeg" alt="Shinola Coffee Ann Arbor">
      <div class="card-body">
        <button
          class="card-title-btn"
          type="button"
          data-name="Shinola Coffee"
          data-location="Ann Arbor"
          data-rating="4.6"
          data-description="Ann Arbor spot with clean design and balanced espresso drinks. Strong third-space energy."
        >
          Shinola Coffee
        </button>
        <span class="tag">Ann Arbor</span>
      </div>
    </div>

    <!-- NON CLICKABLE FOR NOW -->
    <div class="card">
      <img src="https://source.unsplash.com/400x300/?coffee" alt="Socotra Coffee House">
      <div class="card-body">
        <h3 class="card-title">Socotra Coffee House</h3>
        <span class="tag">Ann Arbor</span>
      </div>
    </div>

  </div>
</section>

</main>

<footer class="site-footer">
  <p>© 2025 Coffee Corner</p>
</footer>


<!-- MODAL -->
<div class="modal" id="shopModal">
  <div class="modal-overlay" data-close="true"></div>

  <div class="modal-card">
    <button class="modal-close" data-close="true">×</button>

    <h3 id="modalTitle"></h3>
    <p class="modal-location" id="modalSubtitle"></p>
    <p class="modal-rating" id="modalRating"></p>
    <p class="modal-description" id="modalDescription"></p>
  </div>
</div>


<script>
  const modal = document.getElementById("shopModal");
  const titleEl = document.getElementById("modalTitle");
  const subtitleEl = document.getElementById("modalSubtitle");
  const ratingEl = document.getElementById("modalRating");
  const descEl = document.getElementById("modalDescription");

  document.addEventListener("click", function (e) {

    const btn = e.target.closest(".card-title-btn");

    if (btn) {
      titleEl.textContent = btn.dataset.name;
      subtitleEl.textContent = btn.dataset.location;
      ratingEl.textContent = "Rating: " + btn.dataset.rating;
      descEl.textContent = btn.dataset.description;

      modal.classList.add("is-open");
      document.body.style.overflow = "hidden";
      return;
    }

    if (e.target.dataset.close === "true") {
      modal.classList.remove("is-open");
      document.body.style.overflow = "";
    }
  });
</script>

</body>
</html>
